set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g status-position top
set -g status-justify left
set -g status-style 'bg=#1e1e2e fg=#a6adc8'
set -g status-left ''
set -g status-right ' #S '

# Idle shells (user@host or bare hostname) show the window name; anything else, e.g. Claude, shows its title
set -g @tab '#I:#{?#{||:#{m:*@*,#{pane_title}},#{==:#{pane_title},#{host}}},#W,#{=20:pane_title}}'
set -g window-status-format         '#[fg=#a6adc8,bg=#313244] #{p20:#{E:@tab}} '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #{p20:#{E:@tab}} '
set -g window-status-separator '#[fg=#89b4fa,bg=#313244]│'

set -g pane-border-status top
set -g pane-border-format ' #{pane_title} '

set -g set-titles on
set -g set-titles-string '#{pane_title}'

bind w choose-tree -Zw

bind -n C-S-Left  previous-window
bind -n C-S-Right next-window
bind -n C-S-Up    { swap-window -t -1; previous-window }
bind -n C-S-Down  { swap-window -t +1; next-window }

set -g @per_row 6
set -g @tabs '#[range=window|#{window_index}]#{?window_active,#{E:window-status-current-format},#{E:window-status-format}}#[norange default]#{E:window-status-separator}'

set -g status-format[0] '#[align=left]#{W:#{?#{e|<=:#{window_index},#{@per_row}},#{E:@tabs},}}#[align=right]#{E:status-right}'
set -g status-format[1] '#[align=left]#{W:#{?#{e|>:#{window_index},#{@per_row}},#{E:@tabs},}}'

set-hook -g window-linked   'if -F "#{e|>:#{session_windows},#{@per_row}}" "set status 2" "set status on"'
set-hook -g window-unlinked 'if -F "#{e|>:#{session_windows},#{@per_row}}" "set status 2" "set status on"'
set-hook -g client-attached 'if -F "#{e|>:#{session_windows},#{@per_row}}" "set status 2" "set status on"'

if -F '#{e|>:#{session_windows},#{@per_row}}' 'set status 2' 'set status on'

set-option -g set-clipboard on
set -g allow-passthrough on

# Enable OSC 52 clipboard (works for mouse copy, even over SSH)
# This tells tmux to use the terminal's clipboard
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\a'
